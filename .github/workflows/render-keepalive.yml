name: Keep Render service awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "::error::Set the RENDER_URL repository secret to your Render service URL."
            exit 1
          fi
          curl --fail --show-error --silent --retry 3 --retry-all-errors --retry-delay 15 --max-time 60 "${RENDER_URL%/}/health"